<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Thread Generator V1 by salazzar_id</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">
        AI Thread Generator V1 by salazzar_id
      </h1>
      <p class="text-slate-400 text-sm sm:text-base">
        Buat post Thread yang menarik & bernarasi lengkap dengan link afiliasi secara otomatis.
      </p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-xl font-bold text-slate-200 border-b border-slate-700 pb-2">Parameter</h2>
        
        <form id="threadForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
              Topik / Gagasan Utama *
            </label>
            <textarea id="topic" rows="3" required
              placeholder="Contoh: 3 Rekomendasi komponen PC yang harganya masih stabil"
              class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 transition"></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Target Pembaca</label>
              <input type="text" id="targetAudience" placeholder="Gen Z, Pelajar, Pekerja, Semua Orang"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition" />
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Tujuan Konten</label>
              <select id="contentGoal"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                <option value="Edukasi & Soft Selling">Edukasi & Soft Selling</option>
                <option value="Review Produk & Hard Selling">Review & Hard Selling</option>
                <option value="Storytelling & Engagement">Storytelling & Engagement</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Nada / Emosi</label>
              <select id="tone"
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                <option value="Santai & Ramah">Santai & Ramah</option>
                <option value="Penasaran & Persuasif">Penasaran & Persuasif</option>
                <option value="Profesional & Informatif">Profesional & Informatif</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Link Afiliasi (Opsional)</label>
              <input type="url" id="affiliateLink" placeholder="https://s.shopee.co.id/..."
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-indigo-500 transition" />
            </div>
          </div>

          <button type="submit" id="generateBtn"
            class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-lg shadow-lg hover:shadow-indigo-500/30 transition flex justify-center items-center gap-2">
            <span>Generate</span>
          </button>
        </form>
      </section>

      <section class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between border-b border-slate-700 pb-2 mb-4">
            <h2 class="text-xl font-bold text-slate-200">Hasil Utas</h2>
            <button id="copyBtn" class="hidden text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 py-1.5 px-3 rounded transition">
              Salin Semua
            </button>
          </div>

          <div id="outputArea" class="text-sm text-slate-300 space-y-4 whitespace-pre-line min-h-[300px]">
            <p class="text-slate-500 italic text-center py-12">
              Isi parameter lalu klik "Generate Utas" untuk melihat hasil naskah di sini.
            </p>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    document.getElementById('threadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const topic = document.getElementById('topic').value.trim();
      const targetAudience = document.getElementById('targetAudience').value.trim() || 'Umum';
      const contentGoal = document.getElementById('contentGoal').value;
      const tone = document.getElementById('tone').value;
      const affiliateLink = document.getElementById('affiliateLink').value.trim();

      const outputArea = document.getElementById('outputArea');
      const generateBtn = document.getElementById('generateBtn');
      const copyBtn = document.getElementById('copyBtn');

      generateBtn.disabled = true;
      generateBtn.innerText = 'Menyusun Utas...';
      outputArea.innerHTML = '<p class="text-indigo-400 animate-pulse text-center py-12">AI sedang merangkai narasi utas terbaik...</p>';
      copyBtn.classList.add('hidden');

      try {
        // Memanggil API internal Vercel yang menyembunyikan Key
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic, targetAudience, contentGoal, tone, affiliateLink })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          throw new Error(data.error || 'Gagal memproses permintaan.');
        }

        outputArea.textContent = data.result;
        copyBtn.classList.remove('hidden');

      } catch (err) {
        outputArea.innerHTML = `<p class="text-red-400">Terjadi kesalahan: ${err.message}</p>`;
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerText = 'Generate Utas';
      }
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('outputArea').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert('Utas berhasil disalin!');
      });
    });
  </script>
</body>
</html>
